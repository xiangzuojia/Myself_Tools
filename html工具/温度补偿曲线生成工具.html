<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 增加 viewport meta 标签，确保移动端正确缩放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>温度补偿曲线生成器</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }
        h1 {
            font-size: 24px;
            margin: 10px 0 20px 0;
            text-align: center;
        }
        .container {
            display: flex;
            flex-direction: row; /* 默认桌面端横向排列 */
            gap: 30px;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 1200px;
            width: 100%;
            box-sizing: border-box;
        }
        .controls {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 250px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .input-group label {
            font-size: 14px;
            font-weight: bold;
            color: #555;
        }
        .input-group input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px; /* 移动端输入框字号需>=16px防缩放 */
            transition: border-color 0.3s;
            box-sizing: border-box;
            width: 100%;
        }
        .input-group input:focus {
            outline: none;
            border-color: #007bff;
        }
        .btn {
            padding: 12px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: background-color 0.3s;
            margin-top: 10px;
            width: 100%;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .canvas-container {
            flex: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
        }
        canvas {
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            cursor: crosshair;
            max-width: 100%; /* 确保不超出屏幕 */
            height: auto; /* 保持比例 */
        }
        .hint {
            margin-top: 15px;
            font-size: 14px;
            color: #e67e22;
            font-weight: bold;
            background: #fff3e0;
            padding: 12px;
            border-radius: 5px;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
            line-height: 1.5;
        }

        /* ====== 移动端响应式适配 ====== */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            h1 {
                font-size: 20px;
            }
            .container {
                flex-direction: column; /* 移动端改为上下堆叠 */
                padding: 15px;
                gap: 20px;
            }
            .controls {
                min-width: 100%;
            }
            .canvas-container {
                /* 在移动端，为了让图表尽量大，允许横向滚动（如果需要），或者直接缩放 */
                overflow-x: auto;
                align-items: flex-start;
            }
            canvas {
                /* 移动端自适应屏幕宽度 */
                width: 100%; 
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <h1>温度补偿曲线生成器</h1>

    <div class="container">
        <!-- 左侧/上方控制面板 -->
        <div class="controls">
            <div class="input-group">
                <label>高电压值 (例如: 38V)</label>
                <input type="text" id="vHigh" value="38V" oninput="drawChart()">
            </div>
            <div class="input-group">
                <label>低电压值 (例如: 28V)</label>
                <input type="text" id="vLow" value="28V" oninput="drawChart()">
            </div>
            <div class="input-group">
                <label>起始温度 (例如: 35℃)</label>
                <input type="text" id="tLow" value="35℃" oninput="drawChart()">
            </div>
            <div class="input-group">
                <label>结束温度 (例如: 45℃)</label>
                <input type="text" id="tHigh" value="45℃" oninput="drawChart()">
            </div>
            <div class="input-group">
                <label>底部注释文字</label>
                <input type="text" id="noteText" value="The temperature compensation curve is only for ambient temperature, not PCB temperature." oninput="drawChart()">
            </div>
            
            <button class="btn" onclick="downloadImage()">📥 下载 PNG 图片</button>
        </div>

        <!-- 右侧/下方画布区域 -->
        <div class="canvas-container">
            <canvas id="myCanvas" width="700" height="450"></canvas>
            <div class="hint">
                💡 提示：移动端请 <b>长按图片</b> 保存，或直接点击上方“下载图片”按钮。电脑端可右键另存为。
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d');

        // 获取输入框元素
        const vHighInput = document.getElementById('vHigh');
        const vLowInput = document.getElementById('vLow');
        const tLowInput = document.getElementById('tLow');
        const tHighInput = document.getElementById('tHigh');
        const noteInput = document.getElementById('noteText');

        // 核心绘图函数
        function drawChart() {
            // 1. 清空画布并填充白色背景
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 获取当前输入的值
            const vHigh = vHighInput.value || '38V';
            const vLow = vLowInput.value || '28V';
            const tLow = tLowInput.value || '35℃';
            const tHigh = tHighInput.value || '45℃';
            const note = noteInput.value || '';

            // 2. 定义坐标点
            const originX = 100;
            const originY = 350;
            
            const yHigh = 100; 
            const yLow = 250;  
            
            const xStart = 150; 
            const xT1 = 250;    
            const xT2 = 450;    
            const xEnd = 650;   

            // 3. 绘制坐标轴
            ctx.beginPath();
            ctx.moveTo(originX, 50);       
            ctx.lineTo(originX, originY);  
            ctx.lineTo(670, originY);      
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 4. 绘制虚线及辅助线
            ctx.setLineDash([5, 5]); // 启用虚线模式

            // 绘制横向黑色虚线
            ctx.beginPath();
            ctx.strokeStyle = '#000000'; 
            ctx.moveTo(originX, yHigh);
            ctx.lineTo(xT1, yHigh);
            ctx.moveTo(originX, yLow);
            ctx.lineTo(xT2, yLow);
            ctx.stroke();

            // 绘制垂直蓝色虚线
            ctx.beginPath();
            ctx.strokeStyle = '#0000ff'; 
            ctx.moveTo(xT1, yHigh);
            ctx.lineTo(xT1, originY);
            ctx.moveTo(xT2, yLow);
            ctx.lineTo(xT2, originY);
            ctx.stroke();
            
            ctx.setLineDash([]); // 恢复实线

            // 5. 绘制红色主折线
            ctx.beginPath();
            ctx.moveTo(xStart, yHigh);
            ctx.lineTo(xT1, yHigh);
            ctx.lineTo(xT2, yLow);
            ctx.lineTo(xEnd, yLow);
            ctx.strokeStyle = '#ff0000'; 
            ctx.lineWidth = 3;
            ctx.lineJoin = 'miter'; 
            ctx.stroke();

            // 6. 绘制文本标签
            ctx.fillStyle = '#000000';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            
            ctx.font = 'bold 18px Arial';
            ctx.fillText(vHigh, originX - 10, yHigh);
            ctx.fillText(vLow, originX - 10, yLow);

            ctx.textAlign = 'center';
            ctx.fillText(tLow, xT1, originY + 25);
            ctx.fillText(tHigh, xT2, originY + 25);

            ctx.font = 'bold 20px Arial';
            ctx.fillText('VGH', originX, 25);
            ctx.fillText('T', 690, originY);

            // 7. 绘制底部注释 (智能平衡两行长度)
            ctx.font = '16px Arial';
            ctx.fillStyle = '#000000';
            ctx.textAlign = 'center';
            
            drawBalancedText(ctx, note, canvas.width / 2, originY + 60, 600, 25);
        }

        // 智能平衡换行算法
        function drawBalancedText(ctx, text, x, y, maxWidth, lineHeight) {
            const fullWidth = ctx.measureText(text).width;
            
            if (fullWidth <= maxWidth) {
                ctx.fillText(text, x, y);
                return;
            }

            const halfWidth = fullWidth / 2;
            let bestIndex = -1;
            let minDiff = Infinity;
            
            for (let i = 0; i < text.length; i++) {
                if (text[i] === ' ') {
                    let leftPart = text.substring(0, i);
                    let width = ctx.measureText(leftPart).width;
                    
                    if (width <= maxWidth) {
                        let diff = Math.abs(width - halfWidth);
                        if (diff < minDiff) {
                            minDiff = diff;
                            bestIndex = i;
                        }
                    }
                }
            }
            
            if (bestIndex !== -1) {
                let line1 = text.substring(0, bestIndex);
                let line2 = text.substring(bestIndex + 1);
                ctx.fillText(line1, x, y);
                ctx.fillText(line2, x, y + lineHeight);
            } else {
                let mid = Math.floor(text.length / 2);
                ctx.fillText(text.substring(0, mid), x, y);
                ctx.fillText(text.substring(mid), x, y + lineHeight);
            }
        }

        // 下载图片功能
        function downloadImage() {
            const dataUrl = canvas.toDataURL('image/png');
            
            // 创建隐藏的 a 标签触发下载
            const link = document.createElement('a');
            link.download = '温度补偿曲线图.png';
            link.href = dataUrl;
            
            // 针对移动端及部分不支持直接下载的浏览器做兼容处理
            if (/(iPhone|iPad|iPod|Android)/i.test(navigator.userAgent)) {
                // 移动端：创建一个临时图片供用户长按保存
                const tempImg = new Image();
                tempImg.src = dataUrl;
                tempImg.style.position = 'fixed';
                tempImg.style.top = '0';
                tempImg.style.left = '0';
                tempImg.style.width = '100%';
                tempImg.style.height = '100%';
                tempImg.style.backgroundColor = 'rgba(0,0,0,0.8)';
                tempImg.style.zIndex = '9999';
                tempImg.style.objectFit = 'contain';
                
                // 点击图片关闭预览
                tempImg.onclick = function() {
                    document.body.removeChild(tempImg);
                };
                
                document.body.appendChild(tempImg);
                alert("已生成高清图片，请长按图片保存到手机相册。点击图片可关闭预览。");
            } else {
                // 电脑端：直接下载
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }

        // 页面加载完成后立即绘制一次
        window.onload = drawChart;

    </script>
</body>
</html>
